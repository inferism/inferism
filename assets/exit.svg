<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="exit: session closed">
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    .dim { fill: #85858b; }
    .txt { fill: #d4d4d8; }
    .hi  { fill: #ffffff; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="998" height="148" rx="14" fill="#0b0b0c" stroke="#2a2a2d" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="148" rx="14" fill="url(#dots)"/>
  <text x="28" y="44" class="dim" font-size="14">$ <tspan class="hi">exit</tspan></text>
  <text x="28" y="78" class="txt" font-size="14">logout</text>
  <text x="28" y="102" class="txt" font-size="14">[session closed] see you in the next commit<tspan class="hi blink"> _</tspan></text>
  <text x="972" y="126" text-anchor="end" class="dim" font-size="11">Connection to inferism closed.</text>
</svg>
