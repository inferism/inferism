<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="58" viewBox="0 0 1000 58" role="img" aria-label="stats">
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    .dim { fill: #85858b; }
    .txt { fill: #d4d4d8; }
    .hi  { fill: #ffffff; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <text x="6" y="14" class="dim" font-size="11">$ gh stats --user inferism</text>
  <text x="6" y="42" class="hi" font-size="26" font-weight="700"><tspan class="dim">~/</tspan>stats</text>
  <text x="994" y="42" text-anchor="end" class="dim" font-size="12">// 01</text>
  <line x1="6" y1="53" x2="994" y2="53" stroke="#2a2a2d" stroke-width="2"/>
</svg>
